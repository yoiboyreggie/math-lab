<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Simulation</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        #emulator-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #game { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<div id="emulator-container">
    <div id="game"></div>
</div>

<script>
    EJS_player = '#game';
    EJS_core = 'dreamcast'; 
    EJS_gameName = "Marvel vs Capcom 2";
    
    // Points back to the working stable CDN since you are testing on your laptop network now
    EJS_pathtodata = 'https://emulatorjs.org'; 
    
    // MAKE SURE THESE SPREADSHEETS END IN .bin AND .cdi AND FORCE DIRECT DOWNLOAD (?dl=1 for dropbox)
    EJS_bios = 'YOUR_DIRECT_DOWNLOAD_BIOS_URL_HERE'; 
    EJS_gameUrl = 'YOUR_DIRECT_DOWNLOAD_ROM_URL_HERE'; 

    EJS_Settings = {
        widescreen: true, 
        aspectRatio: "16:9",
        vSync: false,
        startInFullscreen: false
    };
</script>

<!-- The core engine loader script -->
<script src="https://emulatorjs.orgloader.js"></script>

</body>
</html>
