<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Simulation Lab</title>
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        /* Dynamic 16:9 True Widescreen Viewbox Container */
        #game-frame { 
            width: 100vw; 
            height: 56.25vw; 
            max-height: 100vh; 
            max-width: 177.78vh; 
        }
    </style>
</head>
<body>

    <div id="game-frame">
        <div id="game" style="width:100%; height:100%;"></div>
    </div>

    <!-- Fully Configured Global Automation Scripts -->
    <script type="text/javascript">
        EJS_player = '#game';
        EJS_core = 'dreamcast'; // Connects directly to compiled Flycast hardware parameters
        EJS_widescreen = true;  // Extends 3D tracking lines into true 16:9 widescreen layout
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://jsdelivr.net';
    </script>
    <script src="https://jsdelivr.netloader.js"></script>

</body>
</html>
