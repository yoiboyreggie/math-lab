<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Simulation</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #000; overflow: hidden; }
        #emulator-container { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
        #game { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>

<div id="emulator-container">
    <div id="game"></div>
</div>

<script>
    EJS_player = '#game';
    EJS_core = 'dreamcast'; 
    EJS_gameName = "Marvel vs Capcom 2";
    
    // FIX: This is the official, real CDN directory path from EmulatorJS documentation
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/'; 
    
    // REMINDER: Paste your direct links ending in .bin and .cdi inside these single quotes
    EJS_bios = 'YOUR_DIRECT_DOWNLOAD_BIOS_URL_HERE'; 
    EJS_gameUrl = 'YOUR_DIRECT_DOWNLOAD_ROM_URL_HERE'; 

    EJS_Settings = {
        widescreen: true, 
        aspectRatio: "16:9",
        vSync: false,
        startInFullscreen: false
    };
</script>

<!-- FIX: Added the missing forward slash to correctly link the script engine -->
<script src="https://emulatorjs.org"></script>

</body>
</html>
